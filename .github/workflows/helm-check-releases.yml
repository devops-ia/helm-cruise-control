name: Helm Check Releases

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # every day

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get current release
        id: current_release
        run: |
          echo "current_release=$(grep appVersion charts/cruise-control/Chart.yaml | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
          echo "current_ui=$(yq '.ui.image.tag' charts/cruise-control/values.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install updatecli
        uses: updatecli/updatecli-action@2efa15cbae1751f532f9bfc88f56adafd6d1faed # v3.8.0

      - name: Update dependencies
        run: |
          updatecli apply --config .github/updatecli/helm.yaml --commit=false

      - name: Get latest release
        id: latest_release
        run: |
          echo "latest_release=$(grep appVersion charts/cruise-control/Chart.yaml | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
          echo "latest_ui=$(yq '.ui.image.tag' charts/cruise-control/values.yaml)" >> "$GITHUB_OUTPUT"

      - name: Check if release changed
        id: check_changes
        run: |
          if ! git diff --quiet -- charts/cruise-control; then
            echo "release_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README.md Helm Chart
        if: steps.check_changes.outputs.release_changed == 'true'
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: charts/cruise-control

      - name: Describe changes
        id: describe
        if: steps.check_changes.outputs.release_changed == 'true'
        env:
          CURRENT_RELEASE: ${{ steps.current_release.outputs.current_release }}
          LATEST_RELEASE: ${{ steps.latest_release.outputs.latest_release }}
          CURRENT_UI: ${{ steps.current_release.outputs.current_ui }}
          LATEST_UI: ${{ steps.latest_release.outputs.latest_ui }}
        run: |
          body=""
          if [ "$LATEST_RELEASE" != "$CURRENT_RELEASE" ]; then
            cc_tag=$(echo "$LATEST_RELEASE" | grep -oP '(?<=cc)\d+\.\d+\.\d+')
            title="fix: [cruise-control] new release: $LATEST_RELEASE"
            message="fix: update Cruise Control version to $LATEST_RELEASE"
            branch="chore/upgrade-cruise-control-$LATEST_RELEASE"
            body="Cruise Control version:
          - :information_source: Current: \`$CURRENT_RELEASE\`
          - :up: Upgrade: \`$LATEST_RELEASE\`

          Changelog: https://github.com/cruise-control-for-kafka/cruise-control/releases/tag/$cc_tag
          "
          else
            title="fix: [cruise-control] new UI release: $LATEST_UI"
            message="fix: update Kafka Cruise Control UI version to $LATEST_UI"
            branch="chore/upgrade-cruise-control-ui-$LATEST_UI"
          fi
          if [ "$LATEST_UI" != "$CURRENT_UI" ]; then
            body="$body
          Kafka Cruise Control UI version:
          - :information_source: Current: \`$CURRENT_UI\`
          - :up: Upgrade: \`$LATEST_UI\`

          Releases: https://github.com/devops-ia/kafka-cruise-control-ui/releases
          "
          fi
          {
            echo "title=$title"
            echo "message=$message"
            echo "branch=$branch"
            echo "body<<EOF_BODY"
            echo "$body"
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR with changes
        if: steps.check_changes.outputs.release_changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT_GITHUB }}
          commit-message: ${{ steps.describe.outputs.message }}
          signoff: false
          branch: ${{ steps.describe.outputs.branch }}
          delete-branch: true
          title: ${{ steps.describe.outputs.title }}
          body: ${{ steps.describe.outputs.body }}
          labels: |
            auto-pr-bump-version
