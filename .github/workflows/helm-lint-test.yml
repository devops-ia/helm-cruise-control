name: Lint and Test Helm Charts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          yamale_version: "6.0.0"

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Deploy Kafka (KRaft)
        if: steps.list-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl apply -f .github/kafka-kraft.yaml
          kubectl -n kafka rollout status statefulset/my-cluster-kafka --timeout=300s

      - name: Run ct install
        if: steps.list-changed.outputs.changed == 'true' && github.event_name != 'workflow_dispatch'
        run: ct install --config .github/ct.yaml --helm-extra-args "--timeout 900s --debug"

      - name: "(workflow_dispatch) Run ct install"
        if: github.event_name == 'workflow_dispatch'
        run: ct install --config .github/ct.yaml --helm-extra-args "--timeout 900s --debug" --all

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n kafka logs statefulset/my-cluster-kafka --tail=100 || true
