sources:
  cruise-control:
    kind: dockerimage
    spec:
      image: devopsiaci/cruise-control
      architecture: linux/amd64
      versionfilter:
        kind: regex
        pattern: '^jdk17-cc3\.([1-9]|[1-9][0-9]+)\..*'
  kafka-cruise-control-ui:
    kind: dockerimage
    spec:
      image: devopsiaci/kafka-cruise-control-ui
      architecture: linux/amd64
      versionfilter:
        kind: semver
conditions: {}
targets:
  cruise-control-helm:
    name: bump cruise-control appVersion
    kind: helmchart
    spec:
      name: charts/cruise-control
      file: Chart.yaml
      key: $.appVersion
      versionincrement: patch
    sourceid: cruise-control
  kafka-cruise-control-ui-helm:
    name: bump kafka-cruise-control-ui image tag
    kind: helmchart
    spec:
      name: charts/cruise-control
      file: values.yaml
      key: $.ui.image.tag
      versionincrement: none
    sourceid: kafka-cruise-control-ui
